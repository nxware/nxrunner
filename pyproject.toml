[project]
name = "nxrunner"
description = ""
version = "1.0.3"
dependencies = ["nwebclient", "waitress"]

[project.optional-dependencies]
full = ["pymongo", "buenavista", "pihole6api", "pydub", "smbprotocol", "paramiko", "docker"]
mongo = ["pymongo"]
smb = ["smbprotocol"]
ssh = ["paramiko"]
docker = ["docker"]

[project.urls]
Repository = "https://github.com/nxware/nxrunner"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build]
include = [ "nxrunner/**/*.py", "nxrunner/resources/*" ]

[project.entry-points.nweb_runner]
mongo = "nxrunner.db.mongo:MongoDB"
smb = "nxrunner.fs:Smb"
pihole_api = "nxrunner.apis:PiHoleApi"
audio_convert = "nxrunner.audio:Convert"
jocystick = "nxrunner.hw.i2c:JoystickM5"
elrs_display = "nxrunner.hw.elrs:ElrsDisplay"
wsl = "nxrunner.system:Wsl"
nfile = "nxrunner.system:NFile"
backup = "nxrunner.system:Backup"
nimbot_b1 = "nxrunner.devices.nimbot:NimbotB1"
dashboard_cyd = "nxrunner.devices:DashboardCYD"
nwebdir = "nxrunner.nweb:NWebDir"

[nx]
pydeps="-xx nxrunner"

