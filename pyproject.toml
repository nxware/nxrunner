[project]
name = "nxrunner"
description = "Backup System"
version = "1.0.3"
dependencies = ["nwebclient", "waitress", "flask"]

[project.optional-dependencies]
full = ["pymongo", "buenavista", "pihole6api", "py-trello", "pydub", "smbprotocol", "paramiko", "docker",
        "smbus2", "bleak", "pillow", "requests", "beautifulsoup4", "flask",
        "google-api-python-client", "google-auth-oauthlib", "cryptography", "pyte"]
mongo = ["pymongo"]
smb = ["smbprotocol"]
ssh = ["paramiko"]
docker = ["docker"]
google = ["google-api-python-client", "google-auth-oauthlib"]
crypt = ["cryptography"]
terminal = ["pyte"]

[project.urls]
Repository = "https://github.com/nxware/nxrunner"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build]
include = [ "nxrunner/**/*.py", "nxrunner/resources/*" ]

[project.entry-points.nweb_runner]
mongo = "nxrunner.db.mongo:MongoDB"
smb = "nxrunner.fs:Smb"
pihole_api = "nxrunner.apis:PiHoleApi"
trello = "nxrunner.apis:Trello"
audio_convert = "nxrunner.audio:Convert"
joystick = "nxrunner.hw.i2c:JoystickM5"
as5600 = "nxrunner.hw.i2c:AS5600"
elrs_display = "nxrunner.hw.elrs:ElrsDisplay"
wsl = "nxrunner.system:Wsl"
nfile = "nxrunner.system:NFile"
backup = "nxrunner.system:Backup"
crypt = "nxrunner.system:CryptRunner"
terminal = "nxrunner.system:Terminal"
remote_terminal = "nxrunner.system:RemoteTerminal"
nimbot_b1 = "nxrunner.devices.nimbot:NimbotB1"
dashboard_cyd = "nxrunner.devices:DashboardCYD"
m5_multi = "nxrunner.devices.esp_m5:EspM5"
nwebdir = "nxrunner.nweb:NWebDir"
google_calendar = "nxrunner.apis.google:CalendarAPI"
website = "nxrunner.web:WebsiteController"

[nx]
pydeps="-xx nxrunner"

